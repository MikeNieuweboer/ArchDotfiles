[shell]
font_family = "monospace"
polkit_agent = true

[shell.panel]
transparency_mode = "soft"

[shell.session.power]
shutdown = "hyprshutdown -t 'Shutting Down...' --post-cmd 'shutdown -P 0'"
reboot = "hyprshutdown -t 'Restarting...' --post-cmd 'reboot'"

[shell.screenshot]
confirm_region = true
directory = "~/Pictures/Screenshots"
