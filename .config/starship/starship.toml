"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](white)\
$os\
$username\
[](bg:bright-black fg:white)\
[](bg:black fg:bright-black)\
$directory\
$git_branch\
$git_status\
$character"""

right_format = """$time"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = "white"
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#acdb40'
color_orange = "black"
color_purple = '#b16286'
color_red = '#b5001e'
color_yellow = "green"

[os]
disabled = false
style = "bg:white fg:black"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:white fg:black"
style_root = "bg:white fg:black"
format = '[ $user ]($style)'

[directory]
style = "fg:white bg:black"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Projects" = "󰲋 "
".config" = " "
"Videos" = "󰕧 "
"School" = "󰑴 "

[git_branch]
symbol = ""
style = "fg:green bg:black"
format = '[([](fg:green bg:black inverted)[](fg:green bg:black) $symbol $branch) ]($style)'

[git_status]
style = "bold bg:black fg:green"
format = '[($all_status$ahead_behind )]($style)'

[time]
disabled = false
format = '[$time](bright-black) '
time_format = '%T'

[character]
disabled = false
success_symbol = '[](fg:black bg:color_green)[](fg:color_green)'
error_symbol = '[](fg:black bg:color_red)[](fg:color_red)'
# vimcmd_symbol = '[](bold fg:color_green)'
# vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
# vimcmd_replace_symbol = '[](bold fg:color_purple)'
# vimcmd_visual_symbol = '[](bold fg:color_yellow)'
